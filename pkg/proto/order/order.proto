// pkg/proto/order/order.proto

syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";
option go_package = "pkg/proto/order";

// --- Order ---
message Order {
  string id = 1;
  string user_id = 2;
  string status = 3;
  int64 total_amount = 4;
  repeated OrderItem items = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int64 unit_price = 3;
  int32 quantity = 4;
  int64 subtotal = 5;
}

// --- Create Order ---
// عمداً هیچ فیلد user_id یا price/name اینجا نیست: user_id از JWT
// claims گرفته می‌شود (نه از ورودی کلاینت)، و name/price هم توسط
// خودِ سرویس از Product Service خوانده می‌شود. اعتماد به این
// مقادیر اگر از کلاینت می‌آمدند یعنی هرکسی می‌توانست قیمت دلخواه
// خودش را برای خرید بفرستد
message CreateOrderRequest {
  repeated CreateOrderItemRequest items = 1;
}

message CreateOrderItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

// --- Get Order ---
message GetOrderRequest {
  string id = 1;
}

// --- List My Orders ---
// همیشه سفارش‌های همان کاربر احراز هویت‌شده را برمی‌گرداند؛ به
// همین دلیل هیچ user_id در ورودی نیست
message ListMyOrdersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListMyOrdersResponse {
  // برای سبک ماندن لیست، آیتم‌های هر سفارش اینجا خالی برمی‌گردد؛
  // برای جزئیات کامل باید GetOrder صدا زده شود
  repeated Order orders = 1;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersResponse);
}
